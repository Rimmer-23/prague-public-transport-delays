services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092" # for clients on the host (Python producer on Windows)
    environment:
      # --- KRaft: this single node is both broker and controller (no ZooKeeper) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: jm_BeiUuRzyZb6K96Z_47Q

      # --- Listeners: one address for containers, another for the host ---
      #   INTERNAL  kafka:19092     -> other containers (Spark) in the compose network
      #   EXTERNAL  localhost:9092  -> programs on Windows
      #   CONTROLLER :9093          -> KRaft controller traffic
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Single broker: internal topics cannot have more than 1 replica ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Topics are created explicitly, a typo in a topic name must not create a new one ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:19092"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  kafka-init:
    # One-shot helper: creates the project's topics and exits. Auto-creation is off (see above), and
    # --if-not-exists makes the commands safe to repeat on every `docker compose up`.
    image: apache/kafka:4.3.2
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        topics=/opt/kafka/bin/kafka-topics.sh
        # vehicle positions: 3 partitions, key = trip_id; ordinary log, old messages are deleted after 7 days
        $$topics --bootstrap-server kafka:19092 --create --if-not-exists --topic pid.vehicle_positions \
          --partitions 3 --replication-factor 1
        # disruptions: compacted = Kafka keeps the newest message of every key (disruption id) forever.
        # One partition: all updates in one ordered log. segment.ms / dirty.ratio make the cleaner run on
        # small data too (it never touches the active segment, which by default is rolled once a week).
        $$topics --bootstrap-server kafka:19092 --create --if-not-exists --topic pid.disruptions \
          --partitions 1 --replication-factor 1 \
          --config cleanup.policy=compact --config segment.ms=3600000 --config min.cleanable.dirty.ratio=0.1
        # alerts: few messages, order matters, one partition
        $$topics --bootstrap-server kafka:19092 --create --if-not-exists --topic pid.alerts \
          --partitions 1 --replication-factor 1
        $$topics --bootstrap-server kafka:19092 --list
    restart: "no"

  postgres:
    image: postgres:18.6-alpine
    # not just "postgres": container names are global on the machine, service names are per compose project.
    # Inside the compose network the database is still reachable as postgres:5432 (the service name).
    container_name: pid-postgres
    environment:
      # Values come from .env; used only when the database is created for the first time
      POSTGRES_DB: ${POSTGRES_DB:-pid}
      POSTGRES_USER: ${POSTGRES_USER:-pid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      # read by postgres/init/02_grafana_reader.sql to set the password of the read-only role
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432" # for psql / DBeaver on Windows; not reachable from other machines
    volumes:
      - postgres-data:/var/lib/postgresql # since PostgreSQL 18 the image keeps data in /var/lib/postgresql/<version>
      - ./postgres/init:/docker-entrypoint-initdb.d:ro # *.sql here run once, when the volume is empty
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    container_name: pid-grafana
    ports:
      - "127.0.0.1:3001:3000" # http://localhost:3001 (3000 on the host is taken by another project)
    environment:
      # admin is needed only to edit; the password is applied on the first start (empty grafana-data volume)
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (see .env.example)}
      # dashboards can be viewed without login; acceptable because the port is open on localhost only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/line_delays.json
      # substituted into grafana/provisioning/datasources/postgres.yml
      POSTGRES_DB: ${POSTGRES_DB:-pid}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env (see .env.example)}
    volumes:
      - grafana-data:/var/lib/grafana # Grafana's own database: users, settings
      - ./grafana/provisioning:/etc/grafana/provisioning:ro # data source + where to load dashboards from
      - ./grafana/dashboards:/etc/grafana/dashboards:ro # dashboards as JSON files
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # `&spark` names this whole block, so that the pipeline services below can copy it (`<<: *spark`)
  # and change only what differs.
  spark: &spark
    # apache/spark:4.2.1-java21-python3 + Python libraries for jobs, see spark/Dockerfile.
    # After changing the Dockerfile: docker compose up -d --build spark
    build: ./spark
    image: pid-spark:4.2.1
    container_name: spark
    environment:
      # how jobs reach PostgreSQL from inside the compose network
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pid}
      POSTGRES_USER: ${POSTGRES_USER:-pid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    # The container just stays alive; jobs are started with `docker exec spark spark-submit ...`
    command: ["sleep", "infinity"]
    ports:
      - "4040:4040" # Spark UI of the running job: http://localhost:4040
    volumes:
      - ./spark/jobs:/opt/spark/jobs:ro # job code from the repo (read-only)
      # cache for --packages downloads (Kafka connector); a bind mount because the image user
      # has no home dir and a fresh named volume would be owned by root
      - ./.cache/ivy:/opt/spark/ivy
      # streaming checkpoints (offsets + state); kept on the host so they survive container recreation
      - ./checkpoints:/opt/spark/checkpoints
      # data lake: Parquet files written by jobs (data/raw/vehicle_positions/date=YYYY-MM-DD/...)
      - ./data:/opt/spark/data
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------------------------------------
  # Profile "pipeline": the whole pipeline as background services that start again with Docker.
  #   docker compose --profile pipeline up -d --build      start (or update) everything
  #   docker compose --profile pipeline logs -f --tail 20  follow what the services print
  #   docker compose --profile pipeline down               stop everything (data stays in volumes and ./data)
  # Without --profile these services are ignored: `docker compose up -d` starts only the infrastructure.
  # ------------------------------------------------------------------------------------------------

  producer-positions: &python
    # Producers, the Telegram bot and the GTFS loader share one image: python:3.14.7-slim + requirements.txt
    # (see Dockerfile). The code is mounted, not copied: after editing a script, restart its service.
    profiles: ["pipeline"]
    build: .
    image: pid-python:3.14
    container_name: pid-producer-positions
    command: ["python", "-u", "producers/vehicle_positions.py"]
    env_file: .env # GOLEMIO_API_TOKEN, TELEGRAM_BOT_TOKEN, POSTGRES_*, poll intervals
    environment:
      # inside the compose network: service names instead of localhost (these win over .env)
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./producers:/app/producers:ro
      - ./bot:/app/bot:ro
      - ./scripts:/app/scripts:ro
      - ./data/gtfs:/app/data/gtfs # GTFS files downloaded by scripts/load_gtfs.py, read by Spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  producer-disruptions:
    <<: *python
    container_name: pid-producer-disruptions
    command: ["python", "-u", "producers/disruptions.py"]

  telegram-bot:
    <<: *python
    container_name: pid-telegram-bot
    command: ["python", "-u", "bot/telegram_bot.py"]

  gtfs-loader:
    # Reference data: loads routes and stops on start, then once a day (PID publishes a new archive
    # every night; the script skips the download when the archive did not change).
    <<: *python
    container_name: pid-gtfs-loader
    command: ["sh", "-c", "while true; do python -u scripts/load_gtfs.py; sleep 86400; done"]

  spark-streaming:
    # All streaming queries in one Spark application (spark/jobs/run_all.py).
    # Do not start the same job by hand in the `spark` container while this runs: one checkpoint = one query.
    <<: *spark
    profiles: ["pipeline"]
    container_name: pid-spark-streaming
    command:
      - /opt/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.1
      - --conf
      - spark.jars.ivy=/opt/spark/ivy
      - --driver-memory
      - 2g
      - /opt/spark/jobs/run_all.py
    ports:
      - "4041:4040" # Spark UI: http://localhost:4041 (4040 belongs to jobs started by hand)
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  spark-daily:
    # Daily batch job (spark/jobs/daily_stats.py): once on start, then every day at 05:00 Prague time,
    # when yesterday is complete in the archive. The job is idempotent, an extra run does no harm.
    <<: *spark
    profiles: ["pipeline"]
    container_name: pid-spark-daily
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        while true; do
          /opt/spark/bin/spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.1 \
            --conf spark.jars.ivy=/opt/spark/ivy --conf spark.ui.enabled=false --driver-memory 2g \
            /opt/spark/jobs/daily_stats.py 2>&1 | grep -v -e WARN -e INFO
          now=$$(date +%s)
          next=$$(TZ=Europe/Prague date -d "05:00" +%s)
          if [ "$$next" -le "$$now" ]; then next=$$((next + 86400)); fi
          echo "Next run in $$(( (next - now) / 60 )) minutes."
          sleep $$((next - now))
        done
    ports: []
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  kafka-data:
  postgres-data:
  grafana-data:
