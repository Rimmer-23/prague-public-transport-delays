services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092" # for clients on the host (Python producer on Windows)
    environment:
      # --- KRaft: this single node is both broker and controller (no ZooKeeper) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: jm_BeiUuRzyZb6K96Z_47Q

      # --- Listeners: one address for containers, another for the host ---
      #   INTERNAL  kafka:19092     -> other containers (Spark) in the compose network
      #   EXTERNAL  localhost:9092  -> programs on Windows
      #   CONTROLLER :9093          -> KRaft controller traffic
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Single broker: internal topics cannot have more than 1 replica ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Topics are created explicitly, a typo in a topic name must not create a new one ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:19092"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  spark:
    image: apache/spark:4.2.1-java21-python3
    container_name: spark
    # The container just stays alive; jobs are started with `docker exec spark spark-submit ...`
    command: ["sleep", "infinity"]
    ports:
      - "4040:4040" # Spark UI of the running job: http://localhost:4040
    volumes:
      - ./spark/jobs:/opt/spark/jobs:ro # job code from the repo (read-only)
      # cache for --packages downloads (Kafka connector); a bind mount because the image user
      # has no home dir and a fresh named volume would be owned by root
      - ./.cache/ivy:/opt/spark/ivy
      # streaming checkpoints (offsets + state); kept on the host so they survive container recreation
      - ./checkpoints:/opt/spark/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
